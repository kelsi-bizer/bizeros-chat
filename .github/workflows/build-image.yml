name: Build & publish BizerOS Chat image

on:
  push:
    branches:
      - main
      - 'claude/**'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      upstream_image:
        description: 'Upstream Mattermost base image (overrides Dockerfile default)'
        required: false
        default: ''

concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/bizeros-chat

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short
            type=raw,value=latest,enable={{is_default_branch}}
          labels: |
            org.opencontainers.image.title=BizerOS Chat
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: build/bizeros/Dockerfile
          # Upstream mattermost/mattermost-team-edition publishes amd64
          # only, so multi-arch builds fail to resolve a base manifest.
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ${{ github.event.inputs.upstream_image && format('UPSTREAM_IMAGE={0}', github.event.inputs.upstream_image) || '' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
